services:
  api:
    image: esteban889/inferno-api:v1
    container_name: inferno_api
    working_dir: /app/fastapi_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      DB_HOST: mysql
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  worker:
    image: esteban889/inferno-api:v1
    container_name: inferno_worker
    working_dir: /app/fastapi_app
    command: python -m app.worker
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      DB_HOST: mysql
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: inferno_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: inferno_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: inferno_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: threaderz_store
    ports:
      - "3306:3306"
    volumes:
      - ../store.sql:/docker-entrypoint-initdb.d/init.sql

  dozzle:
    image: amir20/dozzle:latest
    container_name: inferno_dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: inferno_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  portainer:
    image: portainer/portainer-ce:latest
    container_name: inferno_portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

volumes:
  portainer_data:
