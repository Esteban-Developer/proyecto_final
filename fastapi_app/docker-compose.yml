services:
  api:
    build:
      context: ..
      dockerfile: fastapi_app/Dockerfile
    container_name: inferno_api
    working_dir: /app/fastapi_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      DB_HOST: host.docker.internal
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - rabbitmq

  worker:
    build:
      context: ..
      dockerfile: fastapi_app/Dockerfile
    container_name: inferno_worker
    working_dir: /app/fastapi_app
    command: python -m app.worker
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      DB_HOST: host.docker.internal
    depends_on:
      - redis
      - rabbitmq

  redis:
    image: redis:7-alpine
    container_name: inferno_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: inferno_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
